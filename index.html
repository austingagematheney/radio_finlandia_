<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>radio finlandia</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="memory-field">

    <img src="photos/01.JPG" class="memory memory1">
    <img src="photos/02.JPG" class="memory memory2">
    <img src="photos/03.JPG" class="memory memory3">
    <img src="photos/04.JPG" class="memory memory4">
    <img src="photos/05.JPG" class="memory memory5">
    <img src="photos/06.JPG" class="memory memory6">

</div>

<header>

    <div class="station">
        radio finlandia
    </div>

    <div class="live active">

        <span class="live-dot"></span>

        en directo

    </div>

</header>

<section class="sphere-section">

<pre class="sphere" id="sphere">
        _____
    .-'     '-.
  .'           '.
 /               \
|    .. <span id="rf-trigger">rf</span> ..     |
|                 |
 \               /
  '.           .'
    '-._____.-'
</pre>

</section>

<!-- TERMINAL OVERLAY -->
<div class="terminal-overlay" id="terminal-overlay">
    <div class="terminal-box" id="terminal-box">
        <div class="terminal-lines" id="terminal-lines"></div>
        <div class="terminal-input-row" id="terminal-input-row">
            <span class="terminal-prompt">&gt;&nbsp;</span>
            <input
                type="text"
                id="terminal-input"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                maxlength="30">
        </div>
    </div>
</div>

<div class="line"></div>

<section class="archive">

<h2>ARCHIVO</h2>

<div class="entry">

    <span class="date">
        2026.06.06.
    </span>

    <div>

        <a href="#" id="rf001" class="transmission">
            ▶ DJ GUANTAZO : RF001
        </a>

        <div class="progress-container">

            <input
                type="range"
                id="rf001-progress"
                min="0"
                max="100"
                value="0">

        </div>

    </div>

</div>

<div class="entry entry-secret" id="rf002-entry">

    <span class="date">——</span>

    <div>

        <a href="#" id="rf002" class="transmission transmission-secret">
            ▶ RF002_PILOTO
        </a>

        <div class="progress-container">

            <input
                type="range"
                id="rf002-progress"
                min="0"
                max="100"
                value="0">

        </div>

    </div>

</div>

</section>

<script>

/* -------------------- */
/* AUDIO */
/* -------------------- */

const transmission001 =
new Audio("audio/RF001.mp3");

const progress =
document.getElementById(
    "rf001-progress"
);
const rf001 =
document.getElementById("rf001");

rf001.addEventListener("click", function(e){

    e.preventDefault();

    if(transmission001.paused){

        transmission001.play();

        rf001.textContent =
        "▌▌ DJ GUANTAZO : RF001";

    }else{

        transmission001.pause();

        rf001.textContent =
        "▶ DJ GUANTAZO : RF001";
    }
});

transmission001.addEventListener("ended", function(){

    rf001.textContent =
    "▶ DJ GUANTAZO : RF001";
});
transmission001.addEventListener(
    "timeupdate",
    function(){

        if(transmission001.duration){

            progress.value =
            (transmission001.currentTime /
            transmission001.duration) * 100;
        }
    }
);

progress.addEventListener(
    "input",
    function(){

        if(transmission001.duration){

            transmission001.currentTime =
            (progress.value / 100) *
            transmission001.duration;
        }
    }
);

/* -------------------- */
/* SPHERE EXPLOSION */
/* -------------------- */

const sphere =
document.getElementById("sphere");

function explodeSphere(){

    sphere.classList.add("explode");

    setTimeout(function(){

        sphere.classList.remove("explode");

    },12000);
}

function scheduleExplosion(){

    const delay =
        45000 +
        Math.random() * 90000;

    setTimeout(function(){

        explodeSphere();

        scheduleExplosion();

    },delay);
}

scheduleExplosion();

/* -------------------- */
/* TERMINAL */
/* -------------------- */

const ACCESS_CODE = "putaespanyaputaisreal";

const terminalOverlay  = document.getElementById("terminal-overlay");
const terminalLines    = document.getElementById("terminal-lines");
const terminalInput    = document.getElementById("terminal-input");
const terminalInputRow = document.getElementById("terminal-input-row");
const rfTrigger        = document.getElementById("rf-trigger");
const rf002Entry       = document.getElementById("rf002-entry");
const rf002Link        = document.getElementById("rf002");
const progress002      = document.getElementById("rf002-progress");

const transmission002  = new Audio("audio/RF002_PILOTO.wav");

function addLine(text, delay){
    setTimeout(function(){
        const div = document.createElement("div");
        div.textContent = text;
        terminalLines.appendChild(div);
    }, delay);
}

function openTerminal(){
    terminalLines.innerHTML = "";
    terminalInput.value = "";
    terminalInputRow.style.display = "none";
    terminalOverlay.classList.add("open");

    addLine("RADIO FINLANDIA // SISTEMA DE ACCESO", 0);
    addLine("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━", 150);
    addLine("", 300);
    addLine("CONEXIÓN ESTABLECIDA...", 500);
    addLine("", 900);
    addLine("INTRODUCE CÓDIGO DE TRANSMISIÓN:", 1100);
    addLine("", 1300);

    setTimeout(function(){
        terminalInputRow.style.display = "flex";
        terminalInput.focus();
    }, 1400);
}

function closeTerminal(){
    terminalOverlay.classList.remove("open");
}

rfTrigger.addEventListener("click", function(e){
    e.stopPropagation();
    openTerminal();
});

terminalOverlay.addEventListener("click", function(e){
    if(e.target === terminalOverlay) closeTerminal();
});

document.getElementById("terminal-box").addEventListener("click", function(){
    terminalInput.focus();
});

document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && terminalOverlay.classList.contains("open")){
        closeTerminal();
    }
});

terminalInput.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    const attempt = terminalInput.value.trim().toUpperCase();
    if(!attempt) return;

    addLine("> " + attempt, 0);
    terminalInput.value = "";
    terminalInputRow.style.display = "none";

    if(attempt === ACCESS_CODE.toUpperCase()){
        addLine("", 200);
        addLine("ACCESO CONCEDIDO.", 500);
        addLine("TRANSMISIÓN DESBLOQUEADA.", 900);
        setTimeout(function(){
            closeTerminal();
            revealRF002();
        }, 2200);
    } else {
        addLine("", 200);
        addLine("ACCESO DENEGADO.", 500);
        addLine("", 900);
        addLine("INTRODUCE CÓDIGO DE TRANSMISIÓN:", 1100);
        addLine("", 1300);
        setTimeout(function(){
            terminalInputRow.style.display = "flex";
            terminalInput.focus();
        }, 1400);
    }
});

function revealRF002(){
    rf002Entry.style.opacity = "0";
    rf002Entry.style.display = "flex";
    requestAnimationFrame(function(){
        requestAnimationFrame(function(){
            rf002Entry.style.transition = "opacity 1.2s";
            rf002Entry.style.opacity = "1";
        });
    });
}

/* -------------------- */
/* RF002 PLAYER */
/* -------------------- */

rf002Link.addEventListener("click", function(e){
    e.preventDefault();
    if(transmission002.paused){
        transmission002.play();
        rf002Link.textContent = "▌▌ RF002_PILOTO";
    } else {
        transmission002.pause();
        rf002Link.textContent = "▶ RF002_PILOTO";
    }
});

transmission002.addEventListener("ended", function(){
    rf002Link.textContent = "▶ RF002_PILOTO";
    rf002Entry.style.transition = "opacity 2s";
    rf002Entry.style.opacity = "0";
    setTimeout(function(){
        rf002Entry.style.display = "none";
        rf002Entry.style.transition = "";
        rf002Entry.style.opacity = "";
    }, 2000);
});

transmission002.addEventListener("timeupdate", function(){
    if(transmission002.duration){
        progress002.value =
            (transmission002.currentTime / transmission002.duration) * 100;
    }
});

progress002.addEventListener("input", function(){
    if(transmission002.duration){
        transmission002.currentTime =
            (progress002.value / 100) * transmission002.duration;
    }
});

</script>

</body>

</html>
